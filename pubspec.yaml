name: voidduck
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.0+1

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Keeps the app process and CPU alive while the screen shows the pet.
  wakelock_plus: ^1.2.8

  # Camera feed (never rendered; image stream only).
  camera: ^0.11.0+2

  # Opt back into the legacy Camera2-based Android implementation instead of
  # the endorsed camera_android_camerax default. Diagnosed via device logcat:
  # camera_android_camerax's ImageAnalysis use case was failing to acquire a
  # valid image on effectively every frame ("ImageError: Getting Image
  # failed" -> NPE on a null Image, before any of our conversion code ever
  # runs) — a known, closed-as-not-planned CameraX limitation on Level 1/
  # LEGACY camera hardware, exactly the profile of the old phone this runs
  # on. Depending on camera_android directly makes Flutter's plugin
  # resolution prefer it over the camerax default (official opt-back-in
  # mechanism, no code changes needed beyond this).
  camera_android: ^0.10.11

  # Offline face detection. Pinned to ^0.12.0 previously resolved
  # google_mlkit_commons down to 0.9.0, whose Android native InputImage
  # conversion (InputImageConverter.java) wraps everything in one bare
  # try/catch with no per-field null-safety — the exact shape of the
  # "ImageError: Getting Image failed" NPE hit on-device. Upstream has since
  # rewritten that exact function with defensive per-field checks; bumping
  # to pull in the fix.
  google_mlkit_face_detection: ^0.14.0

  # Runtime permission request for the front camera.
  permission_handler: ^11.3.1

  # Persist the tuning panel values + the (much later) two-value carve-out.
  shared_preferences: ^2.3.2
  screen_brightness: ^2.1.11

  # Reaction Engine: bundled on-device Gemma 4 E2B call (spec Section 4/5).
  flutter_gemma: ^1.4.1
  flutter_gemma_litertlm: ^1.3.0

  # On-device speech-to-text (spec Section 4.4, Open_Palm voice trigger) via
  # LiteRT's C API/dart:ffi. Opt-in SttBackendProvider, same "opt-in engine"
  # shape as flutter_gemma_litertlm for the inference side.
  flutter_gemma_speech: ^0.2.0

  # NV21 camera frame -> JPEG, for feeding a real frame to the Reaction
  # Engine (the model needs an encoded image, not a raw YUV buffer).
  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The bundled Reaction Engine model (spec Section 5: bundled as an APK
  # asset, never downloaded at runtime — this is what keeps the INTERNET
  # permission absent forever). noCompress is set in
  # android/app/build.gradle.kts so this stays a single flat, mmap-able file
  # inside the APK rather than getting deflate-compressed.
  assets:
    - assets/models/gemma-4-E2B-it.litertlm
    # MediaPipe Gesture Recognizer (spec Section 4.2.3): Victory/Open_Palm/
    # Closed_Fist detection for the gesture triggers. Bundled the same way
    # as the Gemma model — sourced directly from Google's official
    # storage.googleapis.com/mediapipe-models bucket (Apache-2.0), never
    # downloaded at runtime.
    - assets/models/gesture_recognizer.task
    # Moonshine Tiny STT (spec Section 4.4): on-device transcription for the
    # Open_Palm voice-recording trigger, via flutter_gemma's SpeechRecognizer.
    # Sourced from litert-community/UsefulSensors on Hugging Face (bundled,
    # never downloaded at runtime — CLAUDE.md non-negotiable #7). Its input
    # is a fixed 5-second window ("_5s_" in the filename); longer clips are
    # chunked into 5s segments and transcribed sequentially in Dart.
    - assets/models/moonshine_tiny_5s_f32.tflite
    - assets/models/moonshine_tokenizer.json

  # Stage typeface (SKILL.md "Tactical Telemetry" taste, per the example.html
  # deck): JetBrains Mono dominates the stage — banner, chrome bars, flow
  # screens, panels. Bundled directly from its OFL source rather than via the
  # google_fonts package, which fetches over the network on first use —
  # incompatible with non-negotiable #1 (no INTERNET, ever).
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
